# fly.toml app configuration file generated for azeroth-combat-league on 2026-09-20T21:24:42Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'azeroth-combat-league'
primary_region = 'ams'

[build]
  dockerfile = 'packages/server/Dockerfile'

# Secrets live in `fly secrets set`, not here — see docs/32_DEPLOY_RUNBOOK.md:
#   DATABASE_URL (PG mode switch), SUPABASE_URL + SUPABASE_ANON_KEY
#   (Supabase Auth session validation; without them session routes 401),
#   ACL_WEB_ORIGIN, ACL_ADMIN_ACCOUNTS.
[env]
  ACL_PORT = '8080'
  ACL_SEED = '0'
  ACL_TRUST_PROXY = '1'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/v1/status'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
