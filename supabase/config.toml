project_id = "azeroth-combat-league"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 15

[auth]
enabled = true
# Custom SMTP required for community onboarding — Supabase default SMTP is
# limited to team addresses (docs/17).
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[functions]
enabled = true

[storage]
enabled = true
file_size_limit = "5MiB"
